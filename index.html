<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MOONCRUST</title>
  <meta name="description" content="MOONCRUST — Advanced AI Assistant. Your personal coding intelligence.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lock Screen -->
  <div id="lockScreen" class="lock-screen show">
    <div class="lock-box">
      <div class="lock-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2>Akses Terkunci</h2>
      <p>Masukkan PIN untuk mengakses Mooncrust.</p>
      <input type="password" id="pinInput" placeholder="PIN Akses" autocomplete="off" />
      <button id="pinSubmitBtn">Buka Kunci</button>
      <p id="pinError" class="pin-error"></p>
    </div>
  </div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand-logo">
          <div class="brand-logo__glow"></div>
          <span class="brand-logo__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>
        </div>
        <div>
          <div class="brand-name">
            MOONCRUST <span class="badge-tag">WEB DEV</span>
          </div>
          <div class="brand-status"><span class="dot-live"></span>System Active</div>
        </div>
      </div>

      <button class="btn-new" id="btnNew">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Chat Baru
      </button>

      <div class="sidebar__history" id="historyList"></div>

      <div class="sidebar__footer">
        <div class="model-select-wrapper">
          <span class="model-badge__dot"></span>
          <select id="modelSelect" class="model-select">
            <option value="mc-noob">Mooncrust Noob</option>
            <option value="mc-pro" selected>Mooncrust Pro</option>
            <option value="mc-expert">Mooncrust Expert</option>
            <option value="mc-advance">Mooncrust Advance (Hard)</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <!-- Mobile Header -->
      <div class="topbar" id="topbar">
        <button class="topbar__menu" id="menuBtn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar__title">MOONCRUST <span class="badge-tag">WEB DEV</span></span>
        <div style="width:36px"></div>
      </div>

      <!-- Welcome State -->
      <section class="welcome" id="welcome">
        <h1 class="welcome__title">
          MOONCRUST
          <div class="welcome__subtitle">WEB DEV INTELLIGENCE</div>
        </h1>
        <p class="welcome__desc">Ready to build something extraordinary.</p>
      </section>

      <!-- Chat Messages -->
      <div class="chat" id="chat">
        <div class="chat__messages" id="messages"></div>
      </div>

      <!-- Input -->
      <div class="composer">
        <div class="composer__box">
          <textarea id="input" rows="1" placeholder="Tanya Mooncrust apa saja..."></textarea>
          <button class="composer__send" id="sendBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Code Preview Modal -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-frame">
      <div class="modal-bar">
        <span>💻 Live Preview</span>
        <button id="closePreview">✕</button>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-modals"></iframe>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
