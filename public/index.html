<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MOONCRUST CHATBOT</title>
  <meta name="description" content="Mooncrust — Asisten AI harian untuk semua kebutuhanmu.">
  <meta name="theme-color" content="#171717">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mooncrust">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" integrity="sha384-PiLidnnRuzFgp4qiN8oGNmktrV8ETL+6a8heAxljUX4A+3XWlocwaMn9duBUepfK" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js" integrity="sha384-46dPGH1XlTmj7bc50bqLjTdORXs/3EP2QpA/6EWbelYWOY9VGp+87RT61S3Mcslb" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="style.css?v=2.1.0">
</head>
<body>
  <!-- Lock Screen -->
  <div id="lockScreen" class="lock-screen show">
    <div class="lock-box">
      <div class="lock-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2>Akses Terkunci</h2>
      <p>Masukkan Token Akses untuk membuka Mooncrust.</p>
      <input type="password" id="pinInput" placeholder="Kunci Token Akses" autocomplete="off" />
      <button id="pinSubmitBtn">Buka Kunci</button>
      <p id="pinError" class="pin-error"></p>
    </div>
  </div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand-logo">
          <div class="brand-logo__glow"></div>
          <span class="brand-logo__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>
        </div>
        <div>
          <div class="brand-name">
            MOONCRUST <span class="badge-tag">AI</span>
          </div>
          <div class="brand-status"><span class="dot-live"></span>System Active</div>
        </div>
      </div>

      <button class="btn-new" id="btnNew">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Chat Baru
      </button>

      <button class="btn-sidebar-act" id="btnExport" title="Unduh Riwayat Obrolan">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Ekspor Chat
      </button>

      <div class="sidebar__history" id="historyList"></div>

      <div class="sidebar__footer">
        <div class="model-select-wrapper">
          <span class="model-badge__dot"></span>
          <select id="modelSelect" class="model-select">
            <option value="mc-noob">Cepat</option>
            <option value="mc-pro" selected>Standar</option>
            <option value="mc-expert">Mendalam</option>
            <option value="mc-advance">Maksimal</option>
          </select>
        </div>
        <button class="btn-clear-cache" id="btnClearCache" title="Bersihkan cache lokal dan muat ulang halaman">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Hapus Cache
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <!-- Mobile Header -->
      <div class="topbar" id="topbar">
        <button class="topbar__menu" id="menuBtn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar__title">MOONCRUST <span class="badge-tag">AI</span></span>
        <button class="topbar__act" id="btnExportTop" title="Ekspor & Unduh Obrolan">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>

      <!-- Welcome State -->
      <section class="welcome" id="welcome">
        <h1 class="welcome__title">MOONCRUST</h1>
        <p class="welcome__desc" id="welcomeDesc">Halo! Saya Mooncrust, asisten harianmu. Apa yang ingin kita selesaikan hari ini?</p>
        
        <!-- Quick Inspiration Cards -->
        <div class="welcome__suggestions" id="welcomeSuggestions">
          <button class="sugg-card" onclick="usePrompt('Berikan 5 ide proyek teknologi kreatif dan bermanfaat yang bisa dibuat sekarang')">
            <span class="sugg-icon">💡</span>
            <div class="sugg-text">
              <span class="sugg-title">Ide Proyek Kreatif</span>
              <span class="sugg-sub">Inspirasi & konsep baru</span>
            </div>
          </button>
          <button class="sugg-card" onclick="usePrompt('Bantu saya membuat script JavaScript sederhana dan jelaskan alurnya langkah demi langkah')">
            <span class="sugg-icon">💻</span>
            <div class="sugg-text">
              <span class="sugg-title">Bantu Tulis Kode</span>
              <span class="sugg-sub">Coding & troubleshooting</span>
            </div>
          </button>
          <button class="sugg-card" onclick="usePrompt('Rangkumkan tips terbaik untuk menjaga fokus dan produktivitas harian')">
            <span class="sugg-icon">🎯</span>
            <div class="sugg-text">
              <span class="sugg-title">Tips Produktivitas</span>
              <span class="sugg-sub">Atur waktu lebih optimal</span>
            </div>
          </button>
          <button class="sugg-card" onclick="usePrompt('Tolong jelaskan konsep Artificial Intelligence secara sederhana dan mudah dipahami')">
            <span class="sugg-icon">🤖</span>
            <div class="sugg-text">
              <span class="sugg-title">Tanya Apa Saja</span>
              <span class="sugg-sub">Penjelasan lugas & jelas</span>
            </div>
          </button>
        </div>
      </section>

      <!-- Chat Messages -->
      <div class="chat" id="chat">
        <div class="chat__messages" id="messages"></div>
      </div>

      <!-- Input -->
      <div class="composer">
        <!-- Image Preview -->
        <div class="composer__preview" id="imagePreview">
          <img id="previewImg" alt="Preview" />
          <button class="composer__preview-remove" id="removeImage" title="Hapus gambar">✕</button>
        </div>
        <div class="composer__box">
          <label class="composer__attach" for="imageInput" title="Kirim Foto">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </label>
          <input type="file" id="imageInput" accept="image/*" hidden />
          <button class="composer__mic" id="micBtn" type="button" title="Ketik dengan Suara (Voice Input)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Ketik pesan atau kirim foto..."></textarea>
          <button class="composer__send" id="sendBtn" title="Kirim Pesan">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Code Preview Modal -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-frame">
      <div class="modal-bar">
        <span>💻 Live Preview</span>
        <button id="closePreview">✕</button>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-modals"></iframe>
    </div>
  </div>

  <script src="app.js?v=2.1.0"></script>
</body>
</html>
